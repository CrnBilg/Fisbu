plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fisbu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// E2E-001: gerçek Testcontainers Postgres'e karşı çalışan uçtan uca testler için AYRI bir
// kaynak seti. Bilerek `test`/`compileTestJava`'dan izole — argümansız `./gradlew test` veya
// `./gradlew build` bu testleri TETİKLEMEZ, sadece açıkça `./gradlew e2eTest` ile çalışır.
sourceSets {
	e2e {
		java.srcDir 'src/e2e/java'
		resources.srcDir 'src/e2e/resources'
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	e2eImplementation.extendsFrom testImplementation
	e2eRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'com.cloudinary:cloudinary-http44:1.36.0'
	// Firebase Admin SDK — bütçe uyarı/aşım push bildirimlerini FCM üzerinden gönderir
	implementation 'com.google.firebase:firebase-admin:9.4.1'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// SEC-002: migration disiplini — şema artık Hibernate ddl-auto değil, Flyway migration'ları ile yönetiliyor
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// PDF/Excel export — Hafta 3 fiş export endpoint'i
	implementation 'com.github.librepdf:openpdf:1.3.30'
	implementation 'org.apache.poi:poi-ooxml:5.4.0'
	// Ekstre içe aktarma — PDF metin çıkarma ve CSV ayrıştırma
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'
	implementation 'org.apache.commons:commons-csv:1.11.0'
	compileOnly 'org.projectlombok:lombok'
	// SEC-005: Spring Boot BOM'un yönetimi CVE-2026-54291'e (SCRAM channel-binding downgrade,
	// HIGH) karşı henüz güncellenmemiş sürümü çözüyordu — burada açıkça sabitleniyor.
	runtimeOnly 'org.postgresql:postgresql:42.7.12'
	annotationProcessor 'org.projectlombok:lombok'
	// Hexagonal mimari geçişi: domain <-> DTO/entity mapping için MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// E2E-001: Testcontainers sürümü Spring Boot BOM'u tarafından yönetiliyor (projedeki diğer
	// versiyonsuz bağımlılıklarla aynı desen)
	e2eImplementation 'org.testcontainers:junit-jupiter'
	e2eImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('e2eTest', Test) {
	description = 'Gerçek Testcontainers Postgres ile uçtan uca (E2E) testlerini çalıştırır.'
	group = 'verification'
	testClassesDirs = sourceSets.e2e.output.classesDirs
	classpath = sourceSets.e2e.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter test
}

checkstyle {
	toolVersion = '10.20.2'
	config = resources.text.fromUri('https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-10.20.2/src/main/resources/google_checks.xml')
	maxWarnings = Integer.MAX_VALUE
	ignoreFailures = true
}
