spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.dnfhxjupzxlgayihuwkc
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.config.import=optional:application-secret.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# SEC-002: şema artık Flyway migration'ları ile yönetiliyor (bkz. src/main/resources/db/migration).
# baseline-on-migrate=true: mevcut (dolu) veritabanında V1__baseline.sql'i GERÇEKTEN ÇALIŞTIRMAZ,
# sadece "şema zaten bu haliyle burada" diye flyway_schema_history'e kaydeder; sıfırdan/boş bir
# veritabanında ise V1'i normal şekilde çalıştırıp şemayı oluşturur.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.port=${PORT:8080}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
brevo.api-key=${BREVO_API_KEY:}
brevo.from-email=${BREVO_FROM_EMAIL:noreply@fisbu.app}
brevo.from-name=${BREVO_FROM_NAME:FisBu}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT:}
